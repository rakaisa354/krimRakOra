name: Parse CC Statement

on:
  # Triggered by n8n via GitHub API (repository_dispatch)
  repository_dispatch:
    types: [parse-statement]

  # Manual trigger from GitHub UI (for testing)
  workflow_dispatch:
    inputs:
      filename:
        description: "Statement filename in statements/ folder (e.g. ICICI_Bank.md)"
        required: true
        type: string

  # Auto-trigger when a statement MD is pushed to the repo
  push:
    paths:
      - "statements/*.md"

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Write .env
        run: |
          echo "GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID }}" >> .env
          echo "CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}" >> .env
          echo "FX_API_KEY=${{ secrets.FX_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "CARD_PASSWORDS=${{ secrets.CARD_PASSWORDS }}" >> .env
          echo "BASE_CURRENCY=INR" >> .env
          echo "SALARY_DAY=1" >> .env
      # --- Path 1: triggered by repository_dispatch from n8n ---
      # n8n only sends the Drive file ID + filename (small JSON) — the
      # actual encrypted statement PDF is pulled from Drive here, using the
      # same service account credentials.json as Sheets (already scoped to
      # drive.readonly). The PDF only exists on this ephemeral runner's
      # disk for the life of the job; it is never committed to the repo.
      - name: Download statement from Drive (n8n trigger)
        if: github.event_name == 'repository_dispatch'
        run: |
          python3 scripts/download_drive_file.py \
            --file-id "${{ github.event.client_payload.file_id }}" \
            --out "incoming/${{ github.event.client_payload.filename }}"

      - name: Parse statement (n8n trigger)
        if: github.event_name == 'repository_dispatch'
        run: |
          FILE="${{ github.event.client_payload.filename }}"
          echo "Parsing: $FILE"
          python3 finance.py parse --pdf "incoming/$FILE" 2>&1 | tee parse_output.log
          exit ${PIPESTATUS[0]}

      # --- Path 2: manual workflow_dispatch ---
      - name: Parse statement (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          FILE="${{ github.event.inputs.filename }}"
          echo "Parsing: $FILE"
          python3 finance.py parse --file "statements/$FILE" 2>&1 | tee parse_output.log
          exit ${PIPESTATUS[0]}

      # --- Path 3: push trigger — parse all new/changed MDs ---
      - name: Parse all changed statements (push trigger)
        if: github.event_name == 'push'
        run: |
          # git show reads files changed IN the HEAD commit — works with --depth=1 shallow clone
          FILES=$(git show --name-only --pretty=format: HEAD | grep '^statements/.*\.md$' || true)
          if [ -z "$FILES" ]; then
            echo "No statement MD files changed in this push — skipping."
            exit 0
          fi
          echo "$FILES" | while read file; do
            [ -z "$file" ] && continue
            echo "Parsing: $file"
            PYTHONPATH=. python3 finance.py parse --file "$file" 2>&1 | tee -a parse_output.log
            exit_code=${PIPESTATUS[0]}
            if [ "$exit_code" -ne 0 ]; then
              exit $exit_code
            fi
          done

      # --- Archive: notify n8n to move the source file to Archive folder ---
      # Only fires on repository_dispatch (n8n-triggered runs have a file_id to move)
      - name: Archive source file in Google Drive
        if: success() && github.event_name == 'repository_dispatch'
        run: |
          FILE_ID="${{ github.event.client_payload.file_id }}"
          FILENAME="${{ github.event.client_payload.filename }}"
          if [ -n "$FILE_ID" ]; then
            curl -s -X POST "${{ secrets.N8N_ARCHIVE_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"file_id\": \"$FILE_ID\", \"filename\": \"$FILENAME\"}"
            echo "Archive request sent for $FILENAME ($FILE_ID)"
          else
            echo "No file_id in payload — skipping archive (manual or push trigger)"
          fi

      - name: Notify Telegram on success
        if: success()
        run: |
          # Pull finance.py's own summary line ("✓ N rows written, M duplicates
          # skipped" + optional "⚠ N rows need category review") out of the
          # captured output instead of a generic "parsed" message — a silent
          # "0 rows written, 60 duplicates skipped" run used to look identical
          # to a real 60-row import from Telegram alone.
          SUMMARY=$(grep -E "^(✓|⚠)" parse_output.log 2>/dev/null | head -5)
          if [ -z "$SUMMARY" ]; then
            SUMMARY="(no row summary captured)"
          fi
          MSG=$(printf "✅ Statement parsed and written to Sheets.\n\n%s" "$SUMMARY")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MSG"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          # Surface finance.py's own "✗ ..." error line (or the last line of a
          # Python traceback) when available, instead of only a bare link the
          # user has to open on a laptop to make any sense of.
          REASON=$(grep -E "^✗" parse_output.log 2>/dev/null | tail -1)
          if [ -z "$REASON" ]; then
            REASON=$(tail -1 parse_output.log 2>/dev/null)
          fi
          if [ -z "$REASON" ]; then
            REASON="Failed before parsing started (setup/download/credentials step) — check the run log."
          fi
          MSG=$(printf "❌ Statement parse failed.\nReason: %s\n\nDetails: %s/%s/actions/runs/%s" \
            "$REASON" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MSG"

      - name: Clean up downloaded statement and credentials
        if: always()
        run: rm -rf incoming credentials.json .env
